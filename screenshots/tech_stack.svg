<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Tech stack layers</title>
<desc>Layered diagram showing interface layer, orchestration layer, intelligence layer, and data layer</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="400" fill="#ffffff"/>

<rect x="60" y="30" width="560" height="70" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="80" y="52" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#0C447C">Interface layer</text>
<text x="80" y="70" font-family="Arial, sans-serif" font-size="12" fill="#185FA5">Streamlit chat UI</text>
<rect x="380" y="46" width="220" height="38" rx="8" fill="#ffffff" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="490" y="65" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#2C2C2A">FastAPI REST endpoints</text>

<line x1="340" y1="100" x2="340" y2="122" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="60" y="122" width="560" height="60" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="80" y="144" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">Orchestration layer</text>
<text x="80" y="162" font-family="Arial, sans-serif" font-size="12" fill="#534AB7">LangChain — chunking, retrieval, prompting</text>

<line x1="340" y1="182" x2="340" y2="204" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="60" y="204" width="270" height="70" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="80" y="226" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#712B13">Intelligence — LLM</text>
<text x="80" y="244" font-family="Arial, sans-serif" font-size="12" fill="#993C1D">Ollama, Llama 3.2</text>
<text x="80" y="260" font-family="Arial, sans-serif" font-size="12" fill="#993C1D">Local inference</text>

<rect x="350" y="204" width="270" height="70" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="370" y="226" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Intelligence — embeddings</text>
<text x="370" y="244" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">HuggingFace MiniLM</text>
<text x="370" y="260" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Sentence transformers</text>

<line x1="195" y1="274" x2="195" y2="296" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="485" y1="274" x2="340" y2="296" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="60" y="296" width="560" height="60" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="80" y="318" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Data layer</text>
<text x="80" y="336" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">FAISS vector store — local, persistent index</text>
</svg>
